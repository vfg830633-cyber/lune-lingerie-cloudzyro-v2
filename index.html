<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUNE STUDIO | 숏폼 언더웨어 스토어</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .video-feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        .video-feed::-webkit-scrollbar { display: none; }
        .video-feed { -ms-overflow-style: none; scrollbar-width: none; }
        .video-slide { height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; position: relative; }
        .size-btn.active { background: #1c1917; color: #fff; border-color: #1c1917; }
        .color-dot.active { outline: 2px solid #1c1917; outline-offset: 2px; }
    </style>
</head>
<body class="flex justify-center bg-neutral-950">
    <div class="relative w-full max-w-[430px] h-[100dvh] bg-black overflow-hidden shadow-2xl border-x border-white/10">
        <!-- 상단 헤더 -->
        <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-3 pt-4 pb-6 bg-gradient-to-b from-black/85 to-transparent">
            <div class="flex items-center space-x-1.5">
                <span class="text-base font-bold tracking-[0.18em]">LUNE</span>
                <span class="text-[10px] bg-rose-500 text-white px-1.5 py-0.5 rounded font-medium">LIVE</span>
            </div>
            <div class="flex space-x-2.5 text-xs font-medium text-white/70">
                <button onclick="filterFeed('all', this)" class="tab-btn text-white border-b-2 border-white pb-0.5">전체</button>
                <button onclick="filterFeed('bra', this)" class="tab-btn hover:text-white pb-0.5">브라</button>
                <button onclick="filterFeed('panty', this)" class="tab-btn hover:text-white pb-0.5">팬티</button>
                <button onclick="filterFeed('set', this)" class="tab-btn hover:text-white pb-0.5">세트</button>
            </div>
            <div class="flex items-center space-x-1.5">
                <button id="header-user-btn" onclick="openAccountModal()" class="text-[11px] bg-white/15 hover:bg-white/25 backdrop-blur-md text-white px-2.5 py-1.5 rounded-full font-medium">
                    👤 로그인
                </button>
                <button onclick="toggleCart()" class="relative p-1.5 bg-white/15 backdrop-blur-md rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </header>

        <button onclick="toggleMute()" class="absolute top-16 right-4 z-30 bg-black/50 backdrop-blur-md text-white/90 text-[11px] px-2.5 py-1 rounded-full border border-white/15 flex items-center gap-1">
            <span id="mute-icon">🔇</span> <span id="mute-text">터치하여 소리 켜기</span>
        </button>

        <main id="video-feed" class="video-feed"></main>

        <!-- 옵션 선택 모달 -->
        <div id="buy-modal" class="absolute inset-0 z-40 hidden bg-black/60 flex flex-col justify-end">
            <div class="bg-[#FAF9F6] text-[#2C2A29] rounded-t-2xl p-5 space-y-4">
                <div class="flex justify-between items-start border-b border-stone-200 pb-3">
                    <div class="flex gap-3">
                        <img id="modal-thumb" src="" class="w-14 h-16 object-cover rounded bg-stone-200">
                        <div>
                            <span id="modal-tag" class="text-[10px] bg-stone-800 text-white px-1.5 py-0.5 rounded">BEST</span>
                            <h3 id="modal-title" class="text-sm font-bold mt-1">상품명</h3>
                            <p id="modal-price" class="text-sm font-bold text-rose-600 mt-0.5">0원</p>
                        </div>
                    </div>
                    <button onclick="closeBuyModal()" class="text-stone-400 hover:text-black text-2xl leading-none">&times;</button>
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-2">컬러 선택</label>
                    <div id="modal-colors" class="flex gap-2.5"></div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-2">사이즈 선택</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="selectSize(this, 'S (70A-75A)')" class="size-btn border border-stone-300 py-2 text-xs rounded">S</button>
                        <button type="button" onclick="selectSize(this, 'M (75B-80A)')" class="size-btn border border-stone-300 py-2 text-xs rounded">M</button>
                        <button type="button" onclick="selectSize(this, 'L (80B-85A)')" class="size-btn border border-stone-300 py-2 text-xs rounded">L</button>
                        <button type="button" onclick="selectSize(this, 'XL (85B-90B)')" class="size-btn border border-stone-300 py-2 text-xs rounded">XL</button>
                    </div>
                    <p id="size-hint" class="text-[11px] text-stone-500 mt-1.5">사이즈를 선택해주세요.</p>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="addToCart(false)" class="border border-stone-800 text-stone-800 text-xs py-3.5 rounded-lg font-medium">장바구니 담기</button>
                    <button onclick="addToCart(true)" class="bg-stone-900 text-white text-xs py-3.5 rounded-lg font-medium">바로 구매하기</button>
                </div>
            </div>
        </div>

        <!-- 장바구니 및 주문서 -->
        <div id="cart-drawer" class="absolute inset-0 z-50 hidden bg-black/70 flex flex-col justify-end">
            <div class="bg-[#FAF9F6] text-[#2C2A29] rounded-t-2xl p-5 max-h-[90dvh] overflow-y-auto space-y-4">
                <div class="flex justify-between items-center border-b border-stone-200 pb-3">
                    <h3 class="text-sm font-bold">장바구니 및 주문서 작성</h3>
                    <button onclick="toggleCart()" class="text-2xl text-stone-400 leading-none">&times;</button>
                </div>
                <div id="cart-user-banner" class="bg-stone-200/70 rounded-lg px-3 py-2 text-xs flex justify-between items-center">
                    <span>비회원 주문 (환불 계좌 적립 불가)</span>
                    <button onclick="toggleCart(); openAccountModal();" class="text-rose-600 font-bold underline">로그인/가입</button>
                </div>
                <div id="cart-list" class="space-y-3 max-h-[24dvh] overflow-y-auto"></div>
                <div class="border-t border-stone-200 pt-3 space-y-2.5 text-xs">
                    <p class="font-bold text-stone-800">배송지 정보 (한국 국내배송)</p>
                    <input id="order-name" type="text" placeholder="수령인 성함 (예: 김지민)" class="w-full border border-stone-300 rounded px-3 py-2 bg-white">
                    <input id="order-phone" type="tel" placeholder="연락처 (예: 010-1234-5678)" class="w-full border border-stone-300 rounded px-3 py-2 bg-white">
                    <input id="order-address" type="text" placeholder="도로명 주소 및 상세주소" class="w-full border border-stone-300 rounded px-3 py-2 bg-white">
                </div>
                <div class="border-t border-stone-200 pt-3 space-y-2">
                    <div class="flex justify-between text-xs text-stone-500">
                        <span>배송비 (5만원 이상 무료)</span>
                        <span id="ship-fee">0원</span>
                    </div>
                    <div class="flex justify-between text-sm font-bold">
                        <span>총 결제금액</span>
                        <span id="total-price" class="text-rose-600">0원</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button onclick="submitOrder('카카오페이')" class="bg-[#FEE500] text-[#191919] text-xs py-3 rounded-lg font-bold">카카오페이 결제</button>
                        <button onclick="submitOrder('네이버페이')" class="bg-[#03C75A] text-white text-xs py-3 rounded-lg font-bold">N Pay 결제</button>
                    </div>
                    <button onclick="submitOrder('예치금(계좌잔액) 결제')" class="w-full bg-rose-600 text-white text-xs py-3 rounded-lg font-bold">
                        💰 내 계좌 잔액(환불 예치금)으로 결제하기
                    </button>
                    <button onclick="submitOrder('일반 카드결제')" class="w-full bg-stone-900 text-white text-xs py-2.5 rounded-lg font-medium">
                        일반 카드결제
                    </button>
                </div>
            </div>
        </div>

        <!-- 회원 로그인 / 회원가입 / 내 계좌(환불잔액) 모달 -->
        <div id="account-modal" class="absolute inset-0 z-50 hidden bg-black/75 flex flex-col justify-end">
            <div class="bg-[#FAF9F6] text-[#2C2A29] rounded-t-2xl p-5 max-h-[88dvh] overflow-y-auto space-y-4">
                <div class="flex justify-between items-center border-b border-stone-200 pb-3">
                    <h3 class="text-sm font-bold">회원 계정 및 환불 예치금 계좌</h3>
                    <button onclick="closeAccountModal()" class="text-2xl text-stone-400 leading-none">&times;</button>
                </div>

                <div id="auth-forms" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2 bg-stone-200 p-1 rounded-lg text-xs font-bold">
