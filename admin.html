<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNE ADMIN | 판매자 통합 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">

    <div id="login-screen" class="fixed inset-0 z-50 bg-stone-950 flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="text-center">
                <h1 class="text-lg font-bold tracking-widest">LUNE ADMIN</h1>
                <p class="text-xs text-stone-500 mt-1">판매자 전용 관리자 페이지</p>
            </div>
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">관리자 비밀번호</label>
                <input id="admin-pw" type="password" value="1234" onkeydown="if(event.key==='Enter') doLogin()" class="w-full border border-stone-300 rounded-lg px-3 py-2.5 text-sm">
            </div>
            <button type="button" onclick="doLogin()" class="w-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold py-3 rounded-lg transition">
                관리자 로그인 (1234)
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <nav class="bg-stone-900 text-white px-6 py-4 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center space-x-3">
                <span class="font-bold tracking-widest text-base">LUNE ADMIN</span>
                <span class="text-xs bg-rose-500 px-2 py-0.5 rounded">서버 연동됨</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/" target="_blank" class="bg-white text-stone-900 text-xs font-bold px-4 py-2 rounded-lg">📱 쇼핑몰 열기</a>
                <button onclick="location.reload()" class="text-xs text-stone-400 hover:text-white">로그아웃</button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl border border-stone-200">
                    <p class="text-xs text-stone-500">등록된 숏폼 상품 수</p>
                    <p id="stat-products" class="text-2xl font-bold mt-1">0개</p>
                </div>
                <div class="bg-white p-5 rounded-xl border border-stone-200">
                    <p class="text-xs text-stone-500">총 접수 주문 건수</p>
                    <p id="stat-orders" class="text-2xl font-bold text-rose-600 mt-1">0건</p>
                </div>
                <div class="bg-white p-5 rounded-xl border border-stone-200">
                    <p class="text-xs text-stone-500">누적 매출액</p>
                    <p id="stat-revenue" class="text-2xl font-bold text-emerald-600 mt-1">0원</p>
                </div>
            </div>

            <div class="flex space-x-2 border-b border-stone-300 pb-3">
                <button onclick="switchTab('products', this)" class="tab-btn bg-stone-900 text-white text-xs font-bold px-4 py-2.5 rounded-lg">1. 상품 및 영상 관리</button>
                <button onclick="switchTab('orders', this)" class="tab-btn bg-white text-stone-600 text-xs font-bold px-4 py-2.5 rounded-lg">2. 주문 및 송장 관리</button>
            </div>

            <div id="tab-products" class="grid lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl border border-stone-200 space-y-3 h-fit">
                    <h3 class="text-sm font-bold border-b pb-2.5">새 숏폼 상품 등록</h3>
                    <select id="new-cat" class="w-full border rounded-lg px-3 py-2 text-xs">
                        <option value="bra">심리스 브라 (bra)</option>
                        <option value="panty">노라인 팬티 (panty)</option>
                        <option value="set">세트 구성 (set)</option>
                    </select>
                    <input id="new-name" type="text" placeholder="상품명 *" class="w-full border rounded-lg px-3 py-2 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="new-price" type="number" placeholder="판매가 (원) *" class="w-full border rounded-lg px-3 py-2 text-xs">
                        <input id="new-tag" type="text" placeholder="배지 (BEST / 1+1)" class="w-full border rounded-lg px-3 py-2 text-xs">
                    </div>
                    <input id="new-video" type="url" placeholder="세로형 MP4 동영상 URL" class="w-full border rounded-lg px-3 py-2 text-xs">
                    <input id="new-thumb" type="url" placeholder="썸네일 이미지 URL" class="w-full border rounded-lg px-3 py-2 text-xs">
                    <textarea id="new-desc" rows="2" placeholder="피드 소개글" class="w-full border rounded-lg px-3 py-2 text-xs"></textarea>
                    <button onclick="addProduct()" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-3 rounded-lg">+ 서버에 상품 등록하기</button>
                </div>

                <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-stone-200">
                    <h3 class="text-sm font-bold border-b pb-2.5 mb-4">등록된 상품 목록</h3>
                    <div id="product-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="tab-orders" class="hidden bg-white p-5 rounded-xl border border-stone-200">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-sm font-bold">고객 주문 내역 및 송장 입력</h3>
                    <button onclick="loadData()" class="text-xs bg-stone-100 px-3 py-1.5 rounded">🔄 새로고침</button>
                </div>
                <div id="order-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let adminToken = '';

        async function doLogin() {
            const password = document.getElementById('admin-pw').value.trim();
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    adminToken = data.token;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadData();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('서버 연결 오류');
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-stone-900', 'text-white');
                b.classList.add('bg-white', 'text-stone-600');
            });
            btn.classList.add('bg-stone-900', 'text-white');
            document.getElementById('tab-products').classList.toggle('hidden', tab !== 'products');
            document.getElementById('tab-orders').classList.toggle('hidden', tab !== 'orders');
        }

        async function loadData() {
            const [prodRes, ordRes] = await Promise.all([
                fetch('/api/products').then(r => r.json()),
                fetch('/api/admin/orders', { headers: { 'x-admin-token': adminToken } }).then(r => r.json())
            ]);

            const products = prodRes.data || [];
            const orders = ordRes.data || [];

            document.getElementById('stat-products').innerText = products.length + '개';
            document.getElementById('stat-orders').innerText = orders.length + '건';
            const rev = orders.reduce((s, o) => s + Number(o.total), 0);
            document.getElementById('stat-revenue').innerText = rev.toLocaleString() + '원';

            document.getElementById('product-list').innerHTML = products.map(p => `
                <div class="flex items-center justify-between p-3 border rounded-lg">
                    <div class="flex items-center space-x-3">
                        <img src="${p.thumb}" class="w-12 h-14 object-cover rounded">
                        <div>
                            <span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-bold">${p.tag}</span>
                            <p class="text-xs font-bold mt-1">${p.name}</p>
                            <p class="text-xs text-stone-500">${Number(p.price).toLocaleString()}원</p>
                        </div>
                    </div>
                    <div class="space-x-2">
                        <button onclick="editPrice(${p.id}, ${p.price})" class="text-xs border px-2.5 py-1.5 rounded">가격수정</button>
                        <button onclick="deleteProduct(${p.id})" class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded">삭제</button>
                    </div>
                </div>
            `).join('');

            const orderEl = document.getElementById('order-list');
            orderEl.innerHTML = orders.length === 0
                ? '<p class="text-xs text-stone-400 text-center py-8">접수된 주문이 없습니다.</p>'
                : orders.map(o => `
                    <div class="border rounded-xl p-4 space-y-2 text-xs bg-stone-50">
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-bold">${o.orderNo} (${o.date})</span>
                            <span class="font-bold ${o.tracking ? 'text-emerald-600' : 'text-amber-600'}">${o.tracking ? '배송중: ' + o.tracking : o.status}</span>
                        </div>
                        <p>수령인: ${o.customer.name} / ${o.customer.phone} / ${o.customer.address}</p>
                        <p class="font-bold text-rose-600">결제금액: ${Number(o.total).toLocaleString()}원 (${o.payMethod})</p>
                        <div class="flex gap-2 pt-1">
                            <input id="trk-${o.orderNo}" type="text" value="${o.tracking}" placeholder="CJ대한통운 송장번호" class="border rounded px-2 py-1 flex-1">
                            <button onclick="saveTracking('${o.orderNo}')" class="bg-stone-900 text-white px-3 py-1 rounded">발송처리</button>
                        </div>
                    </div>
                `).join('');
        }

        async function addProduct() {
            const body = {
                category: document.getElementById('new-cat').value,
                name: document.getElementById('new-name').value.trim(),
                price: document.getElementById('new-price').value.trim(),
                tag: document.getElementById('new-tag').value.trim(),
                videoUrl: document.getElementById('new-video').value.trim(),
                thumb: document.getElementById('new-thumb').value.trim(),
                desc: document.getElementById('new-desc').value.trim()
            };
            if (!body.name || !body.price) return alert('상품명과 판매가는 필수입니다.');

            await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
                body: JSON.stringify(body)
            });
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            loadData();
            alert('등록 완료!');
        }

        async function editPrice(id, oldPrice) {
            const price = prompt('새 판매가(원) 입력:', oldPrice);
            if (!price || isNaN(price)) return;
            await fetch(`/api/admin/products/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
                body: JSON.stringify({ price })
            });
            loadData();
        }

        async function deleteProduct(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            await fetch(`/api/admin/products/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': adminToken }
            });
            loadData();
        }

        async function saveTracking(orderNo) {
            const tracking = document.getElementById(`trk-${orderNo}`).value.trim();
            if (!tracking) return alert('송장번호를 입력하세요.');
            await fetch(`/api/admin/orders/${orderNo}/tracking`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
                body: JSON.stringify({ tracking })
            });
            loadData();
            alert('발송 처리되었습니다.');
        }
    </script>
</body>
</html>
